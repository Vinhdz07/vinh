[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-telegram-bot"
version = "0.1.0"
description = "Telegram bot for safe VPS administration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil",
    "python-dotenv",
    "python-telegram-bot",
]

[project.scripts]
vps-telegram-bot = "vps_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
